<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>naruto</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    body { margin: 0; overflow: hidden; background-color: black; font-family: system-ui, sans-serif; }

    #v_src, #out {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover; transform: scaleX(-1);
    }
    #out { z-index: 2; pointer-events: none; }
    .darkness {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(10, 5, 0, 0.3);
      mix-blend-mode: multiply; pointer-events: none; z-index: 5;
    }
    .fx {
      position: absolute; height: auto; top: 0; left: 0;
      transform: translate(-50%, -50%);
      pointer-events: none; display: none; transition: opacity 120ms linear;
      mix-blend-mode: screen; z-index: 20;
    }
    #n { width: min(1600px, 140vw); }
    #s { width: min(2400px, 180vw); }
    #collisionFx, #explosionFx { width: min(1800px, 160vw); z-index: 31; }
    .debug-dot {
      position: fixed; width: 10px; height: 10px; border-radius: 50%;
      display: block; pointer-events: none; z-index: 100;
      transform: translate(-50%, -50%);
    }
    #left-debug-dot { background: #ff3030; }
    #right-debug-dot { background: #30a8ff; }

    #clash-beam, #collision-burst, #collision-flash {
      position: fixed; pointer-events: none; opacity: 0; z-index: 30;
    }
    #clash-beam {
      height: 18px; transform-origin: 0 50%;
      background: linear-gradient(90deg, transparent, #fff, #00d4ff, #fff, transparent);
      filter: blur(3px) drop-shadow(0 0 14px #00d4ff);
    }
    #clash-beam.active { opacity: 0.9; animation: beam-pulse 180ms ease-in-out infinite alternate; }
    #collision-burst {
      width: 28px; height: 28px; border-radius: 50%;
      background: radial-gradient(circle, #fff 0 8%, #00d4ff 22%, #1768ff 44%, transparent 72%);
      transform: translate(-50%, -50%) scale(0.2);
    }
    #collision-burst.active { animation: burst 700ms ease-out forwards; }
    #collision-burst.fallback { display: block; }
    #collision-flash { inset: 0; background: #dffcff; mix-blend-mode: screen; }
    #collision-flash.active { animation: flash 260ms ease-out forwards; }
    @keyframes beam-pulse { from { filter: blur(3px) drop-shadow(0 0 8px #00d4ff); } to { filter: blur(6px) drop-shadow(0 0 24px #fff); } }
    @keyframes burst { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.2); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(13); } }
    @keyframes flash { 0% { opacity: 0.7; } 100% { opacity: 0; } }

    #status {
      position: absolute; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.85); color: #f2f2f2;
      text-align: center; padding: 24px; box-sizing: border-box;
    }
    #status.hidden { display: none; }
    #status h1 { margin: 0 0 12px; font-size: 1.4rem; font-weight: 600; }
    #status p { margin: 0; max-width: 420px; line-height: 1.45; opacity: 0.9; }
    #status code {
      display: inline-block; margin-top: 14px; padding: 8px 12px;
      background: #1a1a1a; border-radius: 6px; font-size: 0.85rem;
    }
    #status button {
      margin-top: 18px; padding: 10px 22px; border: 0; border-radius: 8px;
      background: #00d4ff; color: #041018; font-weight: 600; font-size: 0.95rem;
      cursor: pointer;
    }
    #status button:hover { filter: brightness(1.08); }
  </style>
</head>
<body>

  <video id="v_src" autoplay playsinline muted></video>
  <canvas id="out"></canvas>
  <div class="darkness"></div>

  <video id="n" class="fx" src="assets/naruto.mp4" muted autoplay loop playsinline></video>
  <video id="s" class="fx" src="assets/sasuke.mp4" muted autoplay loop playsinline></video>
  <video id="collisionFx" class="fx" src="assets/collision.mp4" muted playsinline></video>
  <video id="explosionFx" class="fx" src="assets/explosion.mp4" muted playsinline></video>
  <audio id="clash-sound" src="assets/clash.mp3" preload="auto"></audio>
  <div id="left-debug-dot" class="debug-dot"></div>
  <div id="right-debug-dot" class="debug-dot"></div>
  <div id="clash-beam"></div>
  <div id="collision-burst"></div>
  <div id="collision-flash"></div>

  <div id="status">
    <div>
      <h1>Starting camera…</h1>
      <p>Allow camera access when prompted. Open your hand to trigger power effects.</p>
    </div>
  </div>

  <script>
    const vElement = document.getElementById('v_src');
    const cElement = document.getElementById('out');
    const ctx = cElement.getContext('2d');
    const n = document.getElementById('n');
    const s = document.getElementById('s');
    const collisionFx = document.getElementById('collisionFx');
    const explosionFx = document.getElementById('explosionFx');
    const clashSound = document.getElementById('clash-sound');
    const leftDebugDot = document.getElementById('left-debug-dot');
    const rightDebugDot = document.getElementById('right-debug-dot');
    const statusEl = document.getElementById('status');
    const clashBeam = document.getElementById('clash-beam');
    const collisionBurst = document.getElementById('collision-burst');
    const collisionFlash = document.getElementById('collision-flash');

    let pwr = [0, 0];
    let wasOpen = [false, false];
    const effectPositions = [{ x: 0, y: 0 }, { x: 0, y: 0 }];
    const handPositions = [null, null];
    const handLastSeen = [0, 0];
    let sending = false;

    function screenShake() {
      const duration = 500;
      const started = performance.now();
      function shake(now) {
        const progress = Math.min(1, (now - started) / duration);
        const strength = 10 * (1 - progress);
        document.body.style.transform = `translate(${(Math.random() - 0.5) * strength}px, ${(Math.random() - 0.5) * strength}px)`;
        if (progress < 1) requestAnimationFrame(shake);
        else document.body.style.transform = '';
      }
      requestAnimationFrame(shake);
    }

    function showStatus(title, detail, options = {}) {
      const { hint = '', retry = false } = options;
      statusEl.classList.remove('hidden');
      statusEl.innerHTML = `<div>
        <h1>${title}</h1>
        <p>${detail}</p>
        ${hint ? `<code>${hint}</code>` : ''}
        ${retry ? '<br><button type="button" id="retry-cam">Try again</button>' : ''}
      </div>`;
      const btn = document.getElementById('retry-cam');
      if (btn) btn.onclick = () => start(true);
    }

    function hideStatus() {
      statusEl.classList.add('hidden');
    }

    function checkOpen(pts) {
      let count = 0;
      const wrist = pts[0];
      const tips = [8, 12, 16, 20];
      const pips = [6, 10, 14, 18];
      for (let i = 0; i < tips.length; i++) {
        const tip = pts[tips[i]];
        const pip = pts[pips[i]];
        if (Math.hypot(tip.x - wrist.x, tip.y - wrist.y) > Math.hypot(pip.x - wrist.x, pip.y - wrist.y)) count++;
      }
      return count >= 3;
    }

    function triggerCollision(leftPos, rightPos) {
      if (!leftPos || !rightPos) return;

      const centerX = (leftPos.x + rightPos.x) / 2;
      const centerY = (leftPos.y + rightPos.y) / 2;
      const positionVideo = (video) => {
        video.style.left = `${centerX}px`;
        video.style.top = `${centerY}px`;
        video.style.display = 'block';
        video.currentTime = 0;
        video.play().catch(() => {});
      };

      positionVideo(collisionFx);
      window.setTimeout(() => {
        collisionFx.style.display = 'none';
        positionVideo(explosionFx);
        window.setTimeout(() => { explosionFx.style.display = 'none'; }, 600);
      }, 400);
    }

    function onResults(res) {
      if (!vElement.videoWidth) return;

      cElement.width = vElement.videoWidth;
      cElement.height = vElement.videoHeight;
      const now = performance.now();
      ctx.save();
      ctx.clearRect(0, 0, cElement.width, cElement.height);

      let fL = false;
      let fR = false;
      const handDetected = [false, false];

      if (res.multiHandLandmarks && res.multiHandedness) {
        res.multiHandLandmarks.forEach((pts, i) => {
          const label = res.multiHandedness[i].label;
          const isR = label === 'Right';
          const idx = isR ? 1 : 0;
          handDetected[idx] = true;

          ctx.save();
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#00fbff';
          drawConnectors(ctx, pts, HAND_CONNECTIONS, { color: '#00d4ff', lineWidth: 3 });
          drawLandmarks(ctx, pts, { color: '#ffffff', lineWidth: 1, radius: 2 });
          ctx.restore();

          const open = checkOpen(pts);
          pwr[idx] += open ? 0.05 : -0.15;
          pwr[idx] = Math.max(0, Math.min(1, pwr[idx]));

          if (open && !wasOpen[idx]) {
            const vid = isR ? s : n;
            vid.currentTime = 0;
            vid.play().catch(() => {});
          }
          wasOpen[idx] = open;

          const wrist = pts[0];
          const knk = pts[9];
          handPositions[idx] = {
            x: (1 - wrist.x) * window.innerWidth,
            y: wrist.y * window.innerHeight
          };
          handLastSeen[idx] = now;
          let tx;
          let ty;

          if (isR) {
            tx = (wrist.x + knk.x) / 2;
            ty = (wrist.y + knk.y) / 2;
          } else {
            const dx = knk.x - wrist.x;
            const dy = knk.y - wrist.y;
            tx = knk.x + (dx * 0.8);
            ty = knk.y + (dy * 0.8);
          }
          effectPositions[idx].x = (1 - tx) * window.innerWidth;
          effectPositions[idx].y = (ty * window.innerHeight) + (isR ? 0 : -120);

          if (pwr[idx] > 0.01) {
            if (isR) {
              fR = true;
              s.style.left = `${effectPositions[idx].x}px`;
              s.style.top = `${effectPositions[idx].y}px`;
              s.style.opacity = pwr[idx];
            } else {
              fL = true;
              n.style.left = `${effectPositions[idx].x}px`;
              n.style.top = `${effectPositions[idx].y}px`;
              n.style.opacity = pwr[idx];
            }
          }
        });
      }

      if (!fL) {
        pwr[0] = Math.max(0, pwr[0] - 0.15);
        wasOpen[0] = false;
      }
      if (!fR) {
        pwr[1] = Math.max(0, pwr[1] - 0.15);
        wasOpen[1] = false;
      }

      n.style.display = pwr[0] > 0.01 ? 'block' : 'none';
      s.style.display = pwr[1] > 0.01 ? 'block' : 'none';

      const leftPos = handDetected[0] ? handPositions[0] : null;
      const rightPos = handDetected[1] ? handPositions[1] : null;

      if (leftPos && rightPos) {
        leftDebugDot.style.left = `${leftPos.x}px`;
        leftDebugDot.style.top = `${leftPos.y}px`;
        rightDebugDot.style.left = `${rightPos.x}px`;
        rightDebugDot.style.top = `${rightPos.y}px`;
        leftDebugDot.style.display = 'block';
        rightDebugDot.style.display = 'block';

        const dx = leftPos.x - rightPos.x;
        const dy = leftPos.y - rightPos.y;
        const dist = Math.hypot(dx, dy);
        console.log('Collision check:', { leftPos, rightPos, dist, threshold: 200, leftPower: pwr[0], rightPower: pwr[1] });
        if (dist < 260 && !window.collisionLatched) {
          window.lastCollisionAt = now;
          window.collisionLatched = true;
          triggerCollision(leftPos, rightPos);
        } else if (dist > 300) {
          window.collisionLatched = false;
        }
      } else {
        leftDebugDot.style.display = 'none';
        rightDebugDot.style.display = 'none';
        window.collisionLatched = false;
      }
      ctx.restore();
    }

    function cameraErrorMessage(err) {
      const name = err && err.name ? err.name : 'Error';
      if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
        return ['Camera blocked', 'Allow camera access for this site, then click Try again.'];
      }
      if (name === 'NotReadableError' || name === 'TrackStartError') {
        return [
          'Camera in use',
          'Close other tabs/apps using the webcam (Zoom, Teams, Discord, Cursor Simple Browser, another Chrome tab of this page), then click Try again.'
        ];
      }
      if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
        return ['No camera found', 'Connect a webcam, then click Try again.'];
      }
      if (location.protocol === 'file:') {
        return ['Cannot use camera from a file', 'Open this page through Live Server or a local http URL, not by double-clicking the file.'];
      }
      return ['Camera failed', err && err.message ? err.message : String(err)];
    }

    let hands = null;
    let camera = null;

    async function start(isRetry = false) {
      showStatus('Starting camera…', 'Allow camera access when prompted. Open your hand to trigger power effects.');

      if (typeof Hands !== 'function' || typeof Camera !== 'function') {
        showStatus('MediaPipe failed to load', 'Check your internet connection, then refresh.', { retry: true });
        return;
      }

      if (location.protocol === 'file:') {
        showStatus(
          'Open via local server',
          'Double-clicking the HTML file blocks the camera / hand tracker. Use Live Server, or run this in a terminal from the project folder:',
          { hint: 'python -m http.server 8765' }
        );
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showStatus('Camera API unavailable', 'Use Chrome or Edge on localhost / https.', { retry: true });
        return;
      }

      if (vElement.srcObject) {
        vElement.srcObject.getTracks().forEach((t) => t.stop());
        vElement.srcObject = null;
      }
      if (camera && typeof camera.stop === 'function') {
        try { camera.stop(); } catch (_) {}
        camera = null;
      }

      if (!hands) {
        hands = new Hands({
          locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
        });
        hands.setOptions({
          maxNumHands: 2,
          modelComplexity: 1,
          minDetectionConfidence: 0.6,
          minTrackingConfidence: 0.6
        });
        hands.onResults(onResults);
      }

      try {
        camera = new Camera(vElement, {
          onFrame: async () => {
            if (sending || !vElement.videoWidth) return;
            sending = true;
            try {
              await hands.send({ image: vElement });
            } catch (e) {
              console.error(e);
            } finally {
              sending = false;
            }
          },
          width: 1280,
          height: 720
        });
        await camera.start();
        hideStatus();
      } catch (err) {
        console.error(err);
        const [title, detail] = cameraErrorMessage(err);
        showStatus(title, detail, { retry: true });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => start());
    } else {
      start();
    }
  </script>
</body>
</html>
